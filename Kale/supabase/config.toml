# Supabase Configuration for Kalé
# Auto-generated config file

project_id = "kale"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
ip_version = "IPv4"

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Every fresh install signs in anonymously (#11). Anonymous users are
# 'authenticated' and RLS treats them exactly like permanent users.
enable_anonymous_sign_ins = true
# A guest saves their data by linking an email, Google or Apple identity to the
# same user (#12). Hosted projects: Authentication > Sign In / Providers >
# "Allow manual linking".
enable_manual_linking = true

# Anonymous sign-ups are an open door: rate-limit them per IP. The hosted
# projects need the same settings in the dashboard (Authentication > Rate
# Limits), since config.toml only drives the local stack.
[auth.rate_limit]
# Anonymous sign-ins per hour per IP address.
anonymous_users = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Guest upgrade (#12) types codes, not links: both templates must contain
# {{ .Token }}. Hosted projects: copy them into Authentication > Email Templates
# ("Change Email Address" and "Magic Link").
[auth.email.template.email_change]
subject = "Confirm your email for Kalé"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.magic_link]
subject = "Your Kalé sign-in code"
content_path = "./supabase/templates/magic_link.html"

