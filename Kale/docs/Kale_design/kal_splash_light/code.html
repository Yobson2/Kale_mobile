<style>
        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 3s ease-in-out infinite;
        }
        @keyframes spin-slow {
            to { transform: rotate(360deg); }
        }
        .animate-spin-custom {
            animation: spin-slow 1.5s linear infinite;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface-container-lowest font-body text-on-surface overflow-hidden">
<!-- Splash Screen Container -->
<main class="relative h-screen w-full flex flex-col items-center justify-center p-6">
<!-- Background Cultural Texture (Watermark) -->
<div class="absolute inset-0 pointer-events-none opacity-[0.03] flex items-center justify-center overflow-hidden">
<div class="text-[60rem] font-black select-none leading-none tracking-tighter">K</div>
</div>
<!-- Content Area -->
<div class="relative z-10 flex flex-col items-center justify-between h-full w-full max-w-md">
<!-- Top Spacer -->
<div class="h-20"></div>
<!-- Central Brand Anchor -->
<div class="flex flex-col items-center space-y-8 animate-pulse-subtle">
<!-- Geometric "K" Logo -->
<div class="relative w-20 h-20 flex items-center justify-center bg-primary rounded-xl shadow-[0px_20px_40px_rgba(0,108,73,0.15)] overflow-hidden">
<!-- Geometric overlay shapes for the "Digital Loom" aesthetic -->
<div class="absolute top-0 right-0 w-12 h-12 bg-primary-container rounded-full -mr-4 -mt-4 opacity-40"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 bg-inverse-primary rounded-full -ml-2 -mb-2 opacity-30"></div>
<!-- Main Identifier -->
<span class="text-white text-5xl font-black tracking-tighter z-10 select-none">K</span>
</div>
<!-- Editorial Brand Name -->
<div class="text-center">
<h1 class="text-3xl font-black text-on-surface tracking-tighter mb-1">Kalé</h1>
<p class="text-on-surface-variant font-medium text-sm tracking-widest uppercase">The Digital Loom</p>
</div>
</div>
<!-- Bottom Action/Status Section -->
<div class="flex flex-col items-center space-y-12 pb-12">
<!-- Circular Progress Spinner -->
<div class="relative w-10 h-10">
<!-- Track -->
<svg class="w-full h-full text-surface-container-high" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"></circle>
</svg>
<!-- Loading Indicator -->
<svg class="absolute top-0 left-0 w-full h-full text-primary animate-spin-custom" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C6.47715 2 2 6.47715 2 12C2 13.5997 2.37562 15.1116 3.04348 16.4522" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path>
</svg>
</div>
<!-- Legal/App Version Footer -->
<div class="text-center space-y-2">
<div class="flex items-center justify-center space-x-2 text-on-surface-variant opacity-60">
<span class="material-symbols-outlined text-[14px]">lock</span>
<span class="text-[10px] font-bold tracking-[0.15em] uppercase">Secure Financial Weaving</span>
</div>
<div class="h-1 w-8 bg-surface-container-highest mx-auto rounded-full"></div>
</div>
</div>
</div>
<!-- Decorative Asymmetric Elements -->
<div class="absolute top-12 left-12 w-32 h-32 border border-outline-variant/10 rounded-full pointer-events-none"></div>
<div class="absolute bottom-24 -right-16 w-64 h-64 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
