</div>
<div class="flex items-center gap-2">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-emerald-50 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-emerald-600">add</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-emerald-50 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-emerald-600">notifications</span>
</button>
</div>
</header>
<main class="px-6 space-y-8 max-w-2xl mx-auto pt-4">
<!-- Summary Bar -->
<section class="relative overflow-hidden p-6 rounded-xl bg-gradient-to-br from-primary to-primary-container text-on-primary shadow-lg">
<div class="relative z-10 flex flex-col gap-1">
<span class="font-['Inter'] text-[0.6875rem] font-semibold uppercase tracking-wider opacity-80">Total Saved</span>
<div class="flex items-baseline gap-2">
<span class="text-3xl font-bold tracking-tight">XOF 125,000</span>
</div>
</div>
<!-- Geometric watermark pattern -->
<div class="absolute -right-4 -bottom-6 opacity-10 pointer-events-none">
<svg fill="currentColor" height="120" viewbox="0 0 100 100" width="120">
<path d="M20 0 L80 50 L20 100 V70 L50 50 L20 30 Z"></path>
</svg>
</div>
</section>
<!-- Goals List -->
<section class="space-y-4">
<h2 class="font-['Inter'] tracking-tight text-xl font-semibold text-on-surface-variant px-1">Active Goals</h2>
<!-- Goal Card 1 -->
<div class="group relative bg-surface-container-low rounded-xl p-5 flex items-center gap-5 transition-all hover:bg-surface-container-high active:scale-[0.98]">
<div class="relative w-16 h-16 flex-shrink-0">
<svg class="w-full h-full" viewbox="0 0 64 64">
<circle class="text-surface-container-highest" cx="32" cy="32" fill="transparent" r="28" stroke="currentColor" stroke-width="6"></circle>
<circle class="text-primary progress-ring__circle" cx="32" cy="32" fill="transparent" r="28" stroke="currentColor" stroke-dasharray="175.92" stroke-dashoffset="43.98" stroke-linecap="round" stroke-width="6"></circle>
</svg>
<div class="absolute inset-0 flex items-center justify-center">
<span class="text-xs font-bold text-primary">75%</span>
</div>
</div>
<div class="flex-grow min-w-0">
<div class="flex justify-between items-start mb-1">
<h3 class="font-semibold text-on-surface truncate pr-2">Emergency Fund</h3>
<span class="bg-tertiary-container/20 text-on-tertiary-container px-2 py-0.5 rounded-full text-[0.625rem] font-bold whitespace-nowrap">DEC 2024</span>
</div>
<p class="text-sm text-on-surface-variant font-medium">XOF 75,000 / <span class="opacity-60">100,000</span></p>
<button class="mt-3 w-full bg-primary/10 text-primary py-2 rounded-lg text-xs font-bold hover:bg-primary/20 transition-colors uppercase tracking-widest">Add Money</button>
</div>
</div>
<!-- Goal Card 2 -->
<div class="group relative bg-surface-container-low rounded-xl p-5 flex items-center gap-5 transition-all hover:bg-surface-container-high active:scale-[0.98]">
<div class="relative w-16 h-16 flex-shrink-0">
<svg class="w-full h-full" viewbox="0 0 64 64">
<circle class="text-surface-container-highest" cx="32" cy="32" fill="transparent" r="28" stroke="currentColor" stroke-width="6"></circle>
<circle class="text-primary progress-ring__circle" cx="32" cy="32" fill="transparent" r="28" stroke="currentColor" stroke-dasharray="175.92" stroke-dashoffset="140.73" stroke-linecap="round" stroke-width="6"></circle>
</svg>
<div class="absolute inset-0 flex items-center justify-center">
<span class="text-xs font-bold text-primary">20%</span>
</div>
</div>
<div class="flex-grow min-w-0">
<div class="flex justify-between items-start mb-1">
<h3 class="font-semibold text-on-surface truncate pr-2">Japan Vacation</h3>
<span class="bg-surface-container-highest text-on-surface-variant px-2 py-0.5 rounded-full text-[0.625rem] font-bold whitespace-nowrap">AUG 2025</span>
</div>
<p class="text-sm text-on-surface-variant font-medium">XOF 50,000 / <span class="opacity-60">250,000</span></p>
<button class="mt-3 w-full bg-primary/10 text-primary py-2 rounded-lg text-xs font-bold hover:bg-primary/20 transition-colors uppercase tracking-widest">Add Money</button>
</div>
</div>
</section>
<!-- Empty State / Suggestions (Bento Style) -->
<section class="space-y-4 pb-8">
<h2 class="font-['Inter'] tracking-tight text-xl font-semibold text-on-surface-variant px-1">Quick Start</h2>
<div class="grid grid-cols-2 gap-3">
<button class="flex flex-col items-start p-4 rounded-xl bg-surface-container-lowest border border-outline-variant/10 hover:border-primary/40 transition-all text-left group">
<span class="material-symbols-outlined text-tertiary mb-3 group-hover:scale-110 transition-transform">medical_services</span>
<span class="text-sm font-bold text-on-surface">Emergency</span>
<span class="text-[0.625rem] text-on-surface-variant uppercase tracking-wider">Safety first</span>

<span class="material-symbols-outlined text-error mb-3 group-hover:scale-110 transition-transform">school</span>
<span class="text-sm font-bold text-on-surface">Education</span>
<span class="text-[0.625rem] text-on-surface-variant uppercase tracking-wider">Growth</span>
</button>
</div>
