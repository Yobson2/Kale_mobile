<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kalé - Personalize Your Loom</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .editorial-spacing {
            letter-spacing: -0.02em;
        }
        .glass-header {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
        }
        .geometric-k {
            position: absolute;
            right: -10%;
            top: -5%;
            font-size: 20rem;
            font-weight: 900;
            color: #006c49;
            opacity: 0.03;
            pointer-events: none;
            z-index: 0;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "inverse-on-surface": "#eff1f3",
                        "surface": "#f7f9fb",
                        "primary-fixed": "#6ffbbe",
                        "on-tertiary-fixed": "#2a1700",
                        "surface-container": "#eceef0",
                        "background": "#f7f9fb",
                        "outline": "#6c7a71",
                        "on-tertiary-container": "#523200",
                        "surface-container-lowest": "#ffffff",
                        "surface-dim": "#d8dadc",
                        "error-container": "#ffdad6",
                        "inverse-primary": "#4edea3",
                        "primary-container": "#10b981",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#ffb95f",
                        "outline-variant": "#bbcabf",
                        "on-tertiary-fixed-variant": "#653e00",
                        "on-secondary-container": "#5c647a",
                        "on-secondary-fixed": "#131b2e",
                        "secondary-container": "#dae2fd",
                        "secondary": "#565e74",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "secondary-fixed": "#dae2fd",
                        "on-surface-variant": "#3c4a42",
                        "primary": "#006c49",
                        "surface-variant": "#e0e3e5",
                        "on-background": "#191c1e",
                        "tertiary": "#855300",
                        "on-secondary-fixed-variant": "#3f465c",
                        "secondary-fixed-dim": "#bec6e0",
                        "surface-tint": "#006c49",
                        "surface-bright": "#f7f9fb",
                        "on-primary-container": "#00422b",
                        "inverse-surface": "#2d3133",
                        "on-primary-fixed": "#002113",
                        "surface-container-low": "#f2f4f6",
                        "primary-fixed-dim": "#4edea3",
                        "on-primary-fixed-variant": "#005236",
                        "tertiary-container": "#e29100",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e0e3e5",
                        "on-surface": "#191c1e",
                        "surface-container-high": "#e6e8ea",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#ffddb8"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body min-h-screen flex flex-col items-center overflow-x-hidden">
<header class="fixed top-0 w-full z-50 glass-header flex justify-between items-center px-6 py-4">
<div class="text-2xl font-black text-emerald-900 tracking-tighter">Kalé</div>
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-outline">help_outline</span>
</div>
</header>
<main class="relative w-full max-w-lg px-6 pt-32 pb-40 flex-grow flex flex-col">
<div class="geometric-k">K</div>
<section class="mb-12">
<h1 class="text-[3.5rem] leading-none font-bold editorial-spacing text-primary mb-4">Personalize Your Loom</h1>
<p class="text-on-surface-variant text-lg max-w-[85%]">Tailor your financial tapestry to suit your lifestyle and goals.</p>
</section>
<div class="space-y-10">
<div class="space-y-4">
<label class="block font-headline font-semibold text-sm uppercase tracking-widest text-on-surface-variant">Default Currency</label>
<div class="relative group">
<select class="w-full h-14 pl-4 pr-12 bg-surface-container-lowest border border-outline-variant/15 rounded-xl appearance-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none text-on-surface font-medium">
<option value="XOF">XOF - West African CFA franc</option>
<option value="XAF">XAF - Central African CFA franc</option>
<option value="USD">USD - US Dollar</option>
<option value="EUR">EUR - Euro</option>
<option value="NGN">NGN - Nigerian Naira</option>
</select>
<div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none">
<span class="material-symbols-outlined text-outline">unfold_more</span>
</div>
</div>
</div>
<div class="space-y-4">
<div class="flex justify-between items-end">
<label class="block font-headline font-semibold text-sm uppercase tracking-widest text-on-surface-variant">Language</label>
</div>
<div class="flex gap-3">
<button class="flex-1 py-3 px-6 rounded-xl bg-primary text-on-primary font-bold transition-transform active:scale-95">
                        English
                    </button>
<button class="flex-1 py-3 px-6 rounded-xl bg-surface-container-high text-on-surface-variant font-semibold hover:bg-surface-container-highest transition-colors">
                        Français
                    </button>
</div>
</div>
<div class="space-y-4">
<label class="block font-headline font-semibold text-sm uppercase tracking-widest text-on-surface-variant">Primary Goal</label>
<div class="grid grid-cols-1 gap-3">
<div class="group relative bg-surface-container-low rounded-xl p-4 flex items-center gap-4 border border-transparent hover:border-primary/20 transition-all cursor-pointer">
<div class="w-12 h-12 rounded-lg bg-primary-container/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined">insights</span>
</div>
<div class="flex-grow">
<span class="block font-bold text-on-surface">Track Spending</span>
<span class="text-xs text-on-surface-variant">Keep an eye on every weave</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-primary-container bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-on-primary" style="font-variation-settings: 'wght' 700;">check</span>
</div>
</div>
<div class="group relative bg-surface-container-lowest rounded-xl p-4 flex items-center gap-4 border border-outline-variant/15 hover:bg-surface-container-low transition-all cursor-pointer">
<div class="w-12 h-12 rounded-lg bg-tertiary-container/20 flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined">savings</span>
</div>
<div class="flex-grow">
<span class="block font-bold text-on-surface">Save More</span>
<span class="text-xs text-on-surface-variant">Strengthen your financial warp</span>
</div>
</div>
<div class="group relative bg-surface-container-lowest rounded-xl p-4 flex items-center gap-4 border border-outline-variant/15 hover:bg-surface-container-low transition-all cursor-pointer">
<div class="w-12 h-12 rounded-lg bg-secondary-container/30 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined">account_balance_wallet</span>
</div>
<div class="flex-grow">
<span class="block font-bold text-on-surface">Manage Budgets</span>
<span class="text-xs text-on-surface-variant">Master the loom of life</span>
</div>
</div>
</div>
</div>
</div>
</main>
<footer class="fixed bottom-0 w-full max-w-lg bg-background/80 backdrop-blur-lg px-6 pb-10 pt-4 flex flex-col gap-8">
<div class="flex justify-center gap-2">
<div class="w-1.5 h-1.5 rounded-full bg-outline-variant"></div>
<div class="w-1.5 h-1.5 rounded-full bg-outline-variant"></div>
<div class="w-1.5 h-1.5 rounded-full bg-outline-variant"></div>
<div class="w-4 h-1.5 rounded-full bg-primary"></div>
</div>
<button class="w-full h-[52px] bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold rounded-xl shadow-[0px_8px_16px_rgba(0,108,73,0.15)] active:scale-[0.98] transition-all flex items-center justify-center gap-2">
            Get Started
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</footer>
</body></html>
