    }

<body class="bg-background font-body text-on-background selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Top App Bar (Suppressed on focused modal task, but kept as context background layer) -->
<header class="fixed top-0 w-full z-40 bg-white/60 backdrop-blur-md flex justify-between items-center px-6 py-4">
<div class="text-2xl font-black text-emerald-900 tracking-tighter">Kalé</div>
<div class="w-10 h-10 rounded-full bg-surface-container overflow-hidden">
<img alt="User profile photo" class="w-full h-full object-cover" data-alt="Portrait of a smiling professional man" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAufFXIGOzA0ulKn2FxH6v_5Xniof1E60TFfQa5baHQnMImjgBzLQyHCNp9_VaqfxRaUlmx5l93yBWAJcfc1NTrfK-usiYYdras041IXFxsVCDhdAWOsagrEyzSHjaiSsfSPiYomtAsqZk945C8TGKyhFxQru8i_2rH0_k9sN80Y7NQq334puw3CWlx0b-WNdfQDq_pG1l4HiNfF-Y77Tz5Mi_x3Y5XTFYs467OgHwW8bGRKDj6bwW9AwE9UuBtCHm9HAcD6i3DoSA"/>
</div>
</header>
<!-- Background Content Mock (The screen behind the modal) -->
<main class="pt-24 px-6 pb-32">
<div class="h-40 w-full bg-surface-container-low rounded-xl mb-6 opacity-30"></div>
<div class="h-24 w-full bg-surface-container-low rounded-xl mb-4 opacity-30"></div>
<div class="h-24 w-full bg-surface-container-low rounded-xl mb-4 opacity-30"></div>
</main>
<!-- Slide-up Modal Overlay -->
<div class="fixed inset-0 bg-on-surface/20 backdrop-blur-sm z-50 flex flex-col justify-end">
<!-- Close trigger (simulated area) -->
<div class="flex-grow"></div>
<!-- Modal Sheet -->
<div class="bg-surface-container-lowest rounded-t-[2rem] w-full max-w-2xl mx-auto shadow-[0px_-8px_40px_rgba(0,0,0,0.08)] overflow-hidden flex flex-col max-h-[813px]">
<!-- Handle & Header -->
<div class="w-full flex flex-col items-center pt-3 pb-2">
<div class="w-12 h-1.5 bg-surface-variant rounded-full mb-6"></div>
<!-- Expense/Income Toggle -->
<div class="bg-surface-container-high p-1 rounded-full flex gap-1 w-[80%] max-w-xs">
<button class="flex-1 py-2 rounded-full text-sm font-semibold bg-white text-on-surface shadow-sm">Expense</button>
<button class="flex-1 py-2 rounded-full text-sm font-semibold text-on-surface-variant hover:bg-white/50 transition-all">Income</button>
</div>
</div>
<!-- Content Container -->
<div class="px-8 pb-10 pt-4 overflow-y-auto hide-scrollbar">
<!-- Amount Input -->
<div class="mb-10 text-center">
<div class="text-on-surface-variant text-sm font-semibold tracking-widest uppercase mb-1">Enter Amount</div>
<div class="flex items-baseline justify-center gap-2">
<span class="text-3xl font-bold text-on-surface-variant/40">XOF</span>
<input autofocus="" class="w-full max-w-[200px] bg-transparent border-none text-6xl font-black text-on-surface focus:ring-0 text-center tracking-tighter placeholder:text-surface-variant" placeholder="0" type="number"/>
</div>
</div>
<!-- Category Grid -->
<section class="mb-10">
<h3 class="text-title-sm font-bold text-on-surface mb-6 tracking-tight">Select Category</h3>
<div class="grid grid-cols-4 gap-y-8 gap-x-4">
<!-- Food -->
<button class="flex flex-col items-center gap-3 group">
<div class="w-14 h-14 rounded-2xl bg-orange-50 text-orange-600 flex items-center justify-center group-hover:bg-orange-600 group-hover:text-white transition-all">
<span class="material-symbols-outlined text-2xl" data-icon="restaurant">restaurant</span>
</div>
<span class="text-[11px] font-bold text-on-surface-variant uppercase tracking-wider">Food</span>
</button>
<!-- Transport -->
<button class="flex flex-col items-center gap-3 group">
<div class="w-14 h-14 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center group-hover:bg-blue-600 group-hover:text-white transition-all">
<span class="material-symbols-outlined text-2xl" data-icon="directions_car">directions_car</span>
</div>
<span class="text-[11px] font-bold text-on-surface-variant uppercase tracking-wider">Transport</span>
</button>
<!-- Airtime -->
<button class="flex flex-col items-center gap-3 group">
<div class="w-14 h-14 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center group-hover:bg-emerald-600 group-hover:text-white transition-all border-2 border-primary">
<span class="material-symbols-outlined text-2xl" data-icon="edgesensor_low" style="font-variation-settings: 'FILL' 1;">edgesensor_low</span>
</div>
<span class="text-[11px] font-bold text-primary uppercase tracking-wider">Airtime</span>
</button>
<!-- Shopping -->
<button class="flex flex-col items-center gap-3 group">
<div class="w-14 h-14 rounded-2xl bg-purple-50 text-purple-600 flex items-center justify-center group-hover:bg-purple-600 group-hover:text-white transition-all">
<span class="material-symbols-outlined text-2xl" data-icon="shopping_bag">shopping_bag</span>
</div>
<span class="text-[11px] font-bold text-on-surface-variant uppercase tracking-wider">Shopping</span>
</button>
<!-- Utilities -->
<button class="flex flex-col items-center gap-3 group">
<div class="w-14 h-14 rounded-2xl bg-yellow-50 text-yellow-700 flex items-center justify-center group-hover:bg-yellow-700 group-hover:text-white transition-all">
<span class="material-symbols-outlined text-2xl" data-icon="bolt">bolt</span>
</div>
<span class="text-[11px] font-bold text-on-surface-variant uppercase tracking-wider">Utilities</span>
</button>
<!-- Health -->
<button class="flex flex-col items-center gap-3 group">
<div class="w-14 h-14 rounded-2xl bg-red-50 text-red-600 flex items-center justify-center group-hover:bg-red-600 group-hover:text-white transition-all">
<span class="material-symbols-outlined text-2xl" data-icon="medical_services">medical_services</span>
</div>
<span class="text-[11px] font-bold text-on-surface-variant uppercase tracking-wider">Health</span>
</button>
<!-- Entertainment -->
<button class="flex flex-col items-center gap-3 group">
<div class="w-14 h-14 rounded-2xl bg-pink-50 text-pink-600 flex items-center justify-center group-hover:bg-pink-600 group-hover:text-white transition-all">
<span class="material-symbols-outlined text-2xl" data-icon="movie">movie</span>
</div>
<span class="text-[11px] font-bold text-on-surface-variant uppercase tracking-wider">Movies</span>
</button>
<!-- Others -->
<button class="flex flex-col items-center gap-3 group">
<div class="w-14 h-14 rounded-2xl bg-surface-container-high text-on-surface-variant flex items-center justify-center group-hover:bg-on-surface-variant group-hover:text-white transition-all">
<span class="material-symbols-outlined text-2xl" data-icon="more_horiz">more_horiz</span>
</div>
<span class="text-[11px] font-bold text-on-surface-variant uppercase tracking-wider">More</span>
</button>
</div>
</section>
<!-- Details Grid (Date & Payment) -->
<div class="space-y-10">
<!-- Date Picker Simulation -->
<section>
<h3 class="text-title-sm font-bold text-on-surface mb-4 tracking-tight">Date</h3>
<div class="bg-surface-container-low p-4 rounded-xl flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="calendar_today">calendar_today</span>
<span class="font-medium">Today, Oct 24, 2023</span>
</div>
<span class="material-symbols-outlined text-surface-variant" data-icon="chevron_right">chevron_right</span>
</div>
</section>
<!-- Payment Method Chips -->
<section>
<h3 class="text-title-sm font-bold text-on-surface mb-4 tracking-tight">Payment Method</h3>
<div class="flex flex-wrap gap-3">
<button class="px-5 py-3 rounded-xl bg-primary text-white font-semibold text-sm shadow-md flex items-center gap-2">
<span class="material-symbols-outlined text-lg" data-icon="payments" style="font-variation-settings: 'FILL' 1;">payments</span>
                                Cash
                            </button>
<button class="px-5 py-3 rounded-xl bg-surface-container-high text-on-surface-variant font-semibold text-sm flex items-center gap-2 hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-lg" data-icon="smartphone">smartphone</span>
                                Mobile Money
                            </button>
<button class="px-5 py-3 rounded-xl bg-surface-container-high text-on-surface-variant font-semibold text-sm flex items-center gap-2 hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-lg" data-icon="account_balance">account_balance</span>
                                Bank
                            </button>
</div>
</section>
</div>
<!-- Save Button -->
<div class="mt-12">
<button class="w-full h-[56px] rounded-xl bg-gradient-to-r from-primary to-primary-container text-white font-bold text-lg shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                        Save Transaction
                    </button>
</div>
</div>
</div>
</div>

<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-6 pt-2 bg-white z-[60] shadow-[0px_-4px_20px_rgba(0,0,0,0.05)] rounded-t-2xl md:hidden">
<div class="flex flex-col items-center justify-center text-slate-400 px-3 py-1">
<span class="material-symbols-outlined" data-icon="grid_view">grid_view</span>
<span class="font-['Inter'] text-[11px] font-medium uppercase tracking-wider">Dashboard</span>

<div class="flex flex-col items-center justify-center text-slate-400 px-3 py-1">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>

<div class="flex flex-col items-center justify-center bg-emerald-50 text-emerald-700 rounded-xl px-3 py-1 scale-98 transition-transform duration-150">

</div>
<div class="flex flex-col items-center justify-center text-slate-400 px-3 py-1">
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-['Inter'] text-[11px] font-medium uppercase tracking-wider">Budget</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 px-3 py-1">
<span class="material-symbols-outlined" data-icon="more_horiz">more_horiz</span>
<span class="font-['Inter'] text-[11px] font-medium uppercase tracking-wider">More</span>
</div>
</nav>
