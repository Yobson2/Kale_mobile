<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kalé - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary": "#565e74",
                        "on-tertiary-fixed-variant": "#653e00",
                        "tertiary": "#855300",
                        "inverse-primary": "#4edea3",
                        "primary-fixed": "#6ffbbe",
                        "on-tertiary-container": "#523200",
                        "surface-variant": "#e0e3e5",
                        "surface-container": "#eceef0",
                        "on-secondary-fixed-variant": "#3f465c",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#ffb95f",
                        "tertiary-container": "#e29100",
                        "surface-tint": "#006c49",
                        "surface-container-low": "#f2f4f6",
                        "error": "#ba1a1a",
                        "primary": "#006c49",
                        "on-tertiary-fixed": "#2a1700",
                        "on-tertiary": "#ffffff",
                        "surface-container-highest": "#e0e3e5",
                        "on-secondary-fixed": "#131b2e",
                        "on-secondary-container": "#5c647a",
                        "outline-variant": "#bbcabf",
                        "on-primary-fixed-variant": "#005236",
                        "surface-dim": "#d8dadc",
                        "surface-container-lowest": "#ffffff",
                        "secondary-container": "#dae2fd",
                        "on-primary-fixed": "#002113",
                        "inverse-surface": "#2d3133",
                        "secondary-fixed-dim": "#bec6e0",
                        "on-surface-variant": "#3c4a42",
                        "on-primary-container": "#00422b",
                        "on-surface": "#191c1e",
                        "on-error-container": "#93000a",
                        "primary-fixed-dim": "#4edea3",
                        "on-primary": "#ffffff",
                        "surface": "#f7f9fb",
                        "on-error": "#ffffff",
                        "outline": "#6c7a71",
                        "surface-bright": "#f7f9fb",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed": "#ffddb8",
                        "primary-container": "#10b981",
                        "background": "#f7f9fb",
                        "secondary-fixed": "#dae2fd",
                        "surface-container-high": "#e6e8ea",
                        "inverse-on-surface": "#eff1f3",
                        "on-background": "#191c1e"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.75rem", "lg": "1rem", "xl": "1.25rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .editorial-spacing {
            letter-spacing: -0.02em;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .asymmetric-logo-watermark {
            position: absolute;
            top: -20px;
            right: -20px;
            font-size: 180px;
            font-weight: 900;
            opacity: 0.04;
            pointer-events: none;
            color: #006c49;
            transform: rotate(-15deg);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body text-on-surface selection:bg-primary-fixed selection:text-on-primary-fixed min-h-screen flex flex-col">
<!-- Top Navigation (Onboarding Focus) -->
<header class="flex justify-between items-center px-6 py-6 w-full z-50">
<div class="text-2xl font-black text-emerald-900 tracking-tighter">Kalé</div>
<button class="text-secondary font-semibold text-sm hover:text-primary transition-colors">Skip</button>
</header>
<main class="flex-grow flex flex-col px-6 pb-12">
<!-- High-Fidelity Miniature Dashboard Illustration -->
<div class="relative w-full aspect-square max-w-md mx-auto mb-12 flex items-center justify-center">
<!-- Background Elements -->
<div class="absolute inset-0 bg-primary/5 rounded-full scale-90 blur-3xl"></div>
<div class="asymmetric-logo-watermark select-none">K</div>
<!-- Dashboard Mockup Canvas -->
<div class="relative w-full max-w-[320px] aspect-[4/5] bg-surface-container-lowest rounded-xl shadow-[0px_20px_40px_rgba(15,23,42,0.06)] overflow-hidden border border-outline-variant/10">
<!-- Mini Header -->
<div class="px-4 pt-6 pb-4">
<div class="h-2 w-12 bg-surface-container-highest rounded-full mb-2"></div>
<div class="h-4 w-24 bg-on-surface rounded-full"></div>
</div>
<!-- Bento Grid Mockup Elements -->
<div class="p-4 grid grid-cols-2 gap-3">
<!-- Main Balance Card -->
<div class="col-span-2 bg-primary p-4 rounded-lg">
<div class="h-2 w-16 bg-white/30 rounded-full mb-3"></div>
<div class="h-6 w-32 bg-white rounded-full"></div>
</div>
<!-- Expense Mini Card -->
<div class="bg-error-container p-3 rounded-lg flex flex-col gap-2">
<div class="h-2 w-10 bg-on-error-container/20 rounded-full"></div>
<div class="h-4 w-14 bg-on-error-container rounded-full"></div>
</div>
<!-- Budget Mini Card -->
<div class="bg-tertiary-container p-3 rounded-lg flex flex-col gap-2">
<div class="h-2 w-10 bg-on-tertiary-container/20 rounded-full"></div>
<div class="h-4 w-14 bg-on-tertiary-container rounded-full"></div>
</div>
<!-- Chart Mockup (Asymmetric) -->
<div class="col-span-2 mt-2 h-20 flex items-end justify-between px-1">
<div class="w-2 bg-primary-fixed h-1/2 rounded-t-full"></div>
<div class="w-2 bg-primary h-3/4 rounded-t-full"></div>
<div class="w-2 bg-primary-container h-1/3 rounded-t-full"></div>
<div class="w-2 bg-primary h-full rounded-t-full"></div>
<div class="w-2 bg-primary-fixed h-2/3 rounded-t-full"></div>
<div class="w-2 bg-primary-container h-1/2 rounded-t-full"></div>
</div>
</div>
<!-- Floating Interactive Element Overlay -->
<div class="absolute bottom-6 right-[-20px] glass-card p-3 rounded-xl shadow-lg border border-white/50 w-32">
<div class="flex items-center gap-2">
<div class="w-6 h-6 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined text-[14px]">trending_up</span>
</div>
<div class="h-2 w-12 bg-on-surface-variant/40 rounded-full"></div>
</div>
</div>
</div>
<!-- Decorative Blobs -->
<div class="absolute -z-10 top-1/4 -left-4 w-24 h-24 bg-primary-container/20 rounded-full blur-xl"></div>
<div class="absolute -z-10 bottom-1/4 -right-4 w-32 h-32 bg-tertiary-container/10 rounded-full blur-xl"></div>
</div>
<!-- Content Section -->
<div class="text-center md:text-left max-w-md mx-auto md:mx-0">
<h1 class="text-[1.75rem] leading-tight font-bold editorial-spacing text-on-surface mb-4">
                Take Control of Your Money
            </h1>
<p class="text-secondary text-[0.875rem] leading-relaxed max-w-[280px] md:max-w-none">
                Weave your financial threads into a tapestry of growth. Monitor every cent with precision and cultural warmth.
            </p>
</div>
<!-- Footer Actions -->
<div class="mt-auto pt-12">
<!-- Progress Indicator -->
<div class="flex gap-1.5 justify-center md:justify-start mb-8">
<div class="h-1.5 w-8 bg-primary rounded-full"></div>
<div class="h-1.5 w-1.5 bg-surface-container-highest rounded-full"></div>
<div class="h-1.5 w-1.5 bg-surface-container-highest rounded-full"></div>
</div>
<div class="flex flex-col gap-4">
<button class="w-full h-[52px] bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-transform">
<span>Next</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
</main>
<!-- Visual Layering Element -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-50 overflow-hidden">
<div class="absolute top-[-10%] right-[-10%] w-[60%] h-[40%] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary-container/5 rounded-full blur-[100px]"></div>
</div>
</body></html>
