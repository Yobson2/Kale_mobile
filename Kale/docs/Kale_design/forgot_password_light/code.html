<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary-fixed-variant": "#653e00",
              "on-secondary-fixed-variant": "#3f465c",
              "secondary-container": "#dae2fd",
              "primary-fixed-dim": "#4edea3",
              "surface-bright": "#f7f9fb",
              "tertiary-fixed": "#ffddb8",
              "surface": "#f7f9fb",
              "primary-fixed": "#6ffbbe",
              "surface-container-low": "#f2f4f6",
              "secondary-fixed": "#dae2fd",
              "outline-variant": "#bbcabf",
              "outline": "#6c7a71",
              "inverse-on-surface": "#eff1f3",
              "on-background": "#191c1e",
              "on-secondary": "#ffffff",
              "on-tertiary-container": "#523200",
              "error": "#ba1a1a",
              "on-error": "#ffffff",
              "on-primary-fixed-variant": "#005236",
              "surface-dim": "#d8dadc",
              "surface-container-high": "#e6e8ea",
              "primary": "#006c49",
              "on-primary-container": "#00422b",
              "inverse-surface": "#2d3133",
              "secondary": "#565e74",
              "error-container": "#ffdad6",
              "tertiary-fixed-dim": "#ffb95f",
              "on-secondary-container": "#5c647a",
              "on-primary": "#ffffff",
              "on-primary-fixed": "#002113",
              "on-error-container": "#93000a",
              "surface-tint": "#006c49",
              "secondary-fixed-dim": "#bec6e0",
              "surface-variant": "#e0e3e5",
              "surface-container-lowest": "#ffffff",
              "on-tertiary-fixed": "#2a1700",
              "surface-variant": "#e0e3e5",
              "background": "#f7f9fb",
              "on-tertiary": "#ffffff",
              "on-surface": "#191c1e",
              "tertiary-container": "#e29100",
              "surface-container": "#eceef0",
              "on-secondary-fixed": "#131b2e"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-kale-gradient {
            background: linear-gradient(135deg, #006c49 0%, #10b981 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body antialiased">
<!-- Top Navigation Anchor (Manual Suppression Logic: This is a focused transactional task) -->
<!-- Navigation shell suppressed for Forgot Password flow to focus user intent -->
<main class="min-h-screen flex flex-col px-6 pt-12 pb-24 relative overflow-hidden">
<!-- Abstract Geometric 'K' Logo Background Element -->
<div class="absolute -top-12 -right-12 w-64 h-64 opacity-[0.03] pointer-events-none">
<svg class="text-primary" fill="currentColor" viewbox="0 0 100 100">
<path d="M20 10 L20 90 M20 50 L70 10 M40 50 L80 90" stroke="currentColor" stroke-linecap="round" stroke-width="12"></path>
</svg>
</div>
<!-- Header Section: Editorial Authority -->
<header class="mt-12 mb-10">
<div class="w-12 h-1 bg-primary mb-6 rounded-full"></div>
<h1 class="text-[2.5rem] font-bold tracking-[-0.03em] leading-tight text-on-surface">
                Forgot <br/> Password
            </h1>
<p class="mt-4 text-on-surface-variant text-body-md max-w-[280px] leading-relaxed">
                Enter your email and we'll send a reset code
            </p>
</header>
<!-- Form Section -->
<section class="flex-grow space-y-8">
<!-- Input Field: Ghost Border Rule -->
<div class="space-y-2">
<label class="block text-[11px] font-bold uppercase tracking-widest text-outline ml-1" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="person">person</span>
</div>
<input class="block w-full h-[60px] pl-12 pr-4 bg-surface-container-lowest border border-outline-variant/15 rounded-xl focus:ring-2 focus:ring-primary-fixed focus:border-primary transition-all duration-200 outline-none placeholder:text-outline/40" id="email" name="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Primary Action: Gradient & Press Scale -->
<div class="space-y-4">
<button class="w-full h-[52px] bg-kale-gradient text-on-primary font-bold rounded-xl shadow-[0px_8px_16px_rgba(0,108,73,0.15)] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2">
                    Send Reset Code
                    <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Secondary Action: Surface Only -->
<button class="w-full h-[52px] bg-transparent text-primary font-semibold rounded-xl active:bg-surface-container-low transition-colors duration-200 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_back">arrow_back</span>
                    Back to Login
                </button>
</div>
</section>
<!-- Progress Steps: Tonal Layering -->
<footer class="mt-auto">
<div class="flex items-center justify-center gap-3">
<!-- Step 1: Active -->
<div class="h-1.5 w-8 rounded-full bg-primary"></div>
<!-- Step 2: Inactive -->
<div class="h-1.5 w-1.5 rounded-full bg-outline-variant"></div>
<!-- Step 3: Inactive -->
<div class="h-1.5 w-1.5 rounded-full bg-outline-variant"></div>
</div>
<p class="text-center mt-6 text-[11px] font-bold uppercase tracking-widest text-outline/60">
                Step 1 of 3
            </p>
</footer>
<!-- Decorative Surface Layering -->
<div class="fixed bottom-0 left-0 w-full h-1 bg-surface-container-high"></div>
</main>
<!-- Visual Polish: Soft Ambient Glow -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none">
<div class="absolute -bottom-[10%] -left-[10%] w-[50%] h-[40%] bg-primary/5 blur-[120px] rounded-full"></div>
</div>
</body></html>
