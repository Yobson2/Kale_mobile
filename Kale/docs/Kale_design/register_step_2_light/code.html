<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary": "#565e74",
              "on-tertiary-fixed-variant": "#653e00",
              "tertiary": "#855300",
              "inverse-primary": "#4edea3",
              "primary-fixed": "#6ffbbe",
              "on-tertiary-container": "#523200",
              "surface-variant": "#e0e3e5",
              "surface-container": "#eceef0",
              "on-secondary-fixed-variant": "#3f465c",
              "error-container": "#ffdad6",
              "tertiary-fixed-dim": "#ffb95f",
              "tertiary-container": "#e29100",
              "surface-tint": "#006c49",
              "surface-container-low": "#f2f4f6",
              "error": "#ba1a1a",
              "primary": "#006c49",
              "on-tertiary-fixed": "#2a1700",
              "on-tertiary": "#ffffff",
              "surface-container-highest": "#e0e3e5",
              "on-secondary-fixed": "#131b2e",
              "on-secondary-container": "#5c647a",
              "outline-variant": "#bbcabf",
              "on-primary-fixed-variant": "#005236",
              "surface-dim": "#d8dadc",
              "surface-container-lowest": "#ffffff",
              "secondary-container": "#dae2fd",
              "on-primary-fixed": "#002113",
              "inverse-surface": "#2d3133",
              "secondary-fixed-dim": "#bec6e0",
              "on-surface-variant": "#3c4a42",
              "on-primary-container": "#00422b",
              "on-surface": "#191c1e",
              "on-error-container": "#93000a",
              "primary-fixed-dim": "#4edea3",
              "on-primary": "#ffffff",
              "surface": "#f7f9fb",
              "on-error": "#ffffff",
              "outline": "#6c7a71",
              "surface-bright": "#f7f9fb",
              "on-secondary": "#ffffff",
              "tertiary-fixed": "#ffddb8",
              "primary-container": "#10b981",
              "background": "#f7f9fb",
              "secondary-fixed": "#dae2fd",
              "surface-container-high": "#e6e8ea",
              "inverse-on-surface": "#eff1f3",
              "on-background": "#191c1e"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .font-editorial {
        letter-spacing: -0.02em;
      }
      /* Hide navigation shells for transactional pages as per mandate */
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col">
<!-- Top Navigation Bar (Transactional Style - No Shell) -->
<nav class="flex items-center justify-between px-6 py-4 bg-white/60 backdrop-blur-md sticky top-0 z-50">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="text-2xl font-black text-primary tracking-tighter">Kalé</div>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</nav>
<main class="flex-grow flex flex-col px-6 pt-8 pb-12 max-w-md mx-auto w-full">
<!-- Header Section -->
<header class="mb-10">
<h1 class="text-[1.75rem] font-semibold text-on-surface font-headline font-editorial leading-tight mb-2">Complete your profile</h1>
<p class="text-on-surface-variant text-sm">Step 2 of 2: Secure your account</p>
</header>
<!-- Form Section -->
<form class="space-y-6 flex-grow">
<!-- Read-only Email Chip -->
<div class="flex flex-col gap-2">
<span class="text-[0.6875rem] font-bold uppercase tracking-wider text-on-surface-variant px-1">Email Address</span>
<div class="flex items-center gap-3 bg-surface-container-low p-4 rounded-xl">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">alternate_email</span>
<span class="text-on-surface font-medium">alex.weaver@example.com</span>
<span class="ml-auto material-symbols-outlined text-primary-container text-xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Full Name Field -->
<div class="relative group">
<label class="absolute -top-2 left-3 bg-background px-1 text-[0.6875rem] font-semibold text-on-surface-variant uppercase tracking-wider group-focus-within:text-primary transition-colors">Full Name</label>
<input class="w-full h-14 bg-transparent border-outline-variant border-opacity-15 border rounded-xl px-4 text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:border-opacity-100 transition-all font-medium" placeholder="e.g. Alex Weaver" type="text"/>
</div>
<!-- Password Field with Strength Indicator -->
<div class="space-y-3">
<div class="relative group">
<label class="absolute -top-2 left-3 bg-background px-1 text-[0.6875rem] font-semibold text-on-surface-variant uppercase tracking-wider group-focus-within:text-primary transition-colors">Password</label>
<input class="w-full h-14 bg-transparent border-outline-variant border-opacity-15 border rounded-xl px-4 text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:border-opacity-100 transition-all font-medium" type="password" value="Password123"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<!-- Strength Indicator (4-segment) -->
<div class="flex flex-col gap-2 px-1">
<div class="flex gap-1.5 h-1">
<div class="flex-1 bg-error rounded-full"></div>
<div class="flex-1 bg-tertiary-container rounded-full"></div>
<div class="flex-1 bg-surface-container-highest rounded-full"></div>
<div class="flex-1 bg-surface-container-highest rounded-full"></div>
</div>
<span class="text-[0.6875rem] font-bold text-tertiary uppercase tracking-wider">Medium Strength</span>
</div>
</div>
<!-- Confirm Password Field -->
<div class="relative group">
<label class="absolute -top-2 left-3 bg-background px-1 text-[0.6875rem] font-semibold text-on-surface-variant uppercase tracking-wider group-focus-within:text-primary transition-colors">Confirm Password</label>
<input class="w-full h-14 bg-transparent border-outline-variant border-opacity-15 border rounded-xl px-4 text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:border-opacity-100 transition-all font-medium" type="password"/>
</div>
<!-- Terms & Conditions -->
<div class="flex items-start gap-3 pt-2">
<div class="relative flex items-center">
<input class="peer h-5 w-5 rounded border-outline-variant text-primary focus:ring-primary-fixed" id="terms" type="checkbox"/>
</div>
<label class="text-xs text-on-surface-variant leading-relaxed" for="terms">
                    By creating an account, you agree to our <span class="text-primary font-semibold underline underline-offset-2">Terms of Service</span> and <span class="text-primary font-semibold underline underline-offset-2">Privacy Policy</span>.
                </label>
</div>
</form>
<!-- Action Button (Sticky-ish at bottom) -->
<footer class="mt-auto pt-8">
<button class="w-full h-[52px] bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold rounded-xl shadow-[0px_8px_16px_rgba(0,108,73,0.15)] active:scale-[0.98] transition-all duration-150">
                Create Account
            </button>
<p class="text-center text-xs text-on-surface-variant mt-6">
                Already have an account? <span class="text-primary font-bold">Sign In</span>
</p>
</footer>
</main>
<!-- Background Watermark (Geometric 'K' Branding) -->
<div class="fixed bottom-[-10%] right-[-10%] opacity-[0.03] pointer-events-none select-none -z-10 overflow-hidden">
<svg fill="none" height="400" viewbox="0 0 100 100" width="400" xmlns="http://www.w3.org/2000/svg">
<path class="text-on-surface" d="M20 10V90H35V55L70 90H85L50 50L85 10H70L35 45V10H20Z" fill="currentColor"></path>
</svg>
</div>
</body></html>
