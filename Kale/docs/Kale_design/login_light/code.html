<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .geometric-k {
            position: absolute;
            top: -10%;
            right: -10%;
            font-size: 40rem;
            line-height: 1;
            font-weight: 900;
            color: #006c49;
            opacity: 0.03;
            pointer-events: none;
            user-select: none;
            z-index: 0;
        }
        .editorial-spacing {
            letter-spacing: -0.02em;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background font-body min-h-screen flex items-center justify-center overflow-x-hidden">
<!-- Geometric Branding Background -->
<div class="geometric-k font-headline select-none">K</div>
<main class="relative z-10 w-full max-w-[440px] px-6 py-12 md:py-20 flex flex-col gap-10">
<!-- Header Section (Asymmetric Editorial Style) -->
<header class="flex flex-col gap-2">
<div class="flex items-center gap-3 mb-4">
<div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center shadow-lg shadow-primary/20">
<span class="text-on-primary font-black text-xl italic tracking-tighter">K</span>
</div>
</div>
<h1 class="text-[3.5rem] font-bold leading-[1] text-on-surface editorial-spacing">
                Log In
            </h1>
<p class="text-on-surface-variant font-medium text-lg leading-relaxed max-w-[280px]">
                Welcome back to Kalé
            </p>
</header>
<!-- Form Section -->
<form class="flex flex-col gap-6" onsubmit="return false;">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</div>
<input class="w-full h-[56px] pl-12 pr-4 bg-surface-container-low border border-outline-variant/15 rounded-xl text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all font-medium" placeholder="Email address" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="w-full h-[56px] pl-12 pr-12 bg-surface-container-low border border-outline-variant/15 rounded-xl text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all font-medium" placeholder="Password" type="password"/>
<button class="absolute inset-y-0 right-4 flex items-center text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
<div class="flex justify-end">
<button class="text-sm font-semibold text-primary hover:text-on-primary-container transition-colors tracking-tight px-1" type="button">
                        Forgot Password?
                    </button>
</div>
</div>
<!-- Login Button -->
<button class="w-full h-[56px] bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold text-lg rounded-xl shadow-xl shadow-primary/10 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                Log In
            </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<div class="h-[1px] flex-1 bg-surface-container-highest"></div>
<span class="text-label-sm font-bold text-on-surface-variant uppercase tracking-widest text-[10px]">or continue with</span>
<div class="h-[1px] flex-1 bg-surface-container-highest"></div>
</div>
<!-- Social & Guest Actions -->
<div class="flex flex-col gap-4">
<div class="grid grid-cols-2 gap-4">
<button class="h-[52px] flex items-center justify-center gap-3 bg-white border border-outline-variant/20 rounded-xl hover:bg-surface-container-low transition-colors shadow-sm active:scale-[0.98]">
<img alt="" class="w-5 h-5" data-alt="Google logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCemI4oDSROriGiInqecQ9yNrRPQllmQxMRRHP6hK3C4Cfo3yHste4DE6pRtcm0i2POXsbdQLf5VjZgBs6s2WTDnU5-9oQCQ3h1lsf88H2AAJ403ZIIRtRSRTfn-Jit9SgO0YFw4Y4ywE2Lc3CFkg9OzBd9heuhjFJYAmW4YCpux5aXRxyvLlOnRU3Sb-m5nA1-TVyySL4ir627t1Q0ZVxprSQ6702qEazEJegEgZbyrfBMCn2HAYPnlxjGiGpdQ3xPAPoz-IeDaic"/>
<span class="font-semibold text-on-surface text-sm">Google</span>
</button>
<button class="h-[52px] flex items-center justify-center gap-3 bg-on-surface text-white rounded-xl hover:opacity-90 transition-opacity shadow-sm active:scale-[0.98]">
<span class="material-symbols-outlined text-[20px]" data-icon="apple" style="font-variation-settings: 'FILL' 1;">ios</span>
<span class="font-semibold text-sm">Apple</span>
</button>
</div>
<!-- Guest Mode Button with Gradient Border Effect -->
<button class="relative p-[1.5px] rounded-xl bg-gradient-to-tr from-primary/40 to-transparent group active:scale-[0.98] transition-transform">
<div class="w-full h-[52px] flex items-center justify-center gap-2 bg-background rounded-[11px] group-hover:bg-surface-container-lowest transition-colors">
<span class="material-symbols-outlined text-[20px] text-primary" data-icon="bolt">bolt</span>
<span class="font-bold text-primary text-sm tracking-tight">Try First — No Account Needed</span>
</div>
</button>
</div>
<!-- Footer -->
<footer class="text-center mt-auto pt-6">
<p class="text-on-surface-variant text-sm font-medium">
                Don't have an account? 
                <a class="text-primary font-bold hover:underline ml-1" href="#">Sign Up</a>
</p>
</footer>
</main>
<!-- Background Decorative Element (Tonal Shift) -->
<div class="fixed top-0 left-0 w-full h-full -z-20 flex pointer-events-none overflow-hidden">
<div class="absolute -top-1/4 -left-1/4 w-[80%] h-[80%] bg-primary/5 blur-[120px] rounded-full"></div>
<div class="absolute -bottom-1/4 -right-1/4 w-[60%] h-[60%] bg-tertiary-container/5 blur-[120px] rounded-full"></div>
</div>
</body></html>
