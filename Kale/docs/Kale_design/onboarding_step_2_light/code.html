<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "inverse-on-surface": "#eff1f3",
              "surface": "#f7f9fb",
              "primary-fixed": "#6ffbbe",
              "on-tertiary-fixed": "#2a1700",
              "surface-container": "#eceef0",
              "background": "#f7f9fb",
              "outline": "#6c7a71",
              "on-tertiary-container": "#523200",
              "surface-container-lowest": "#ffffff",
              "surface-dim": "#d8dadc",
              "error-container": "#ffdad6",
              "inverse-primary": "#4edea3",
              "primary-container": "#10b981",
              "on-error-container": "#93000a",
              "tertiary-fixed-dim": "#ffb95f",
              "outline-variant": "#bbcabf",
              "on-tertiary-fixed-variant": "#653e00",
              "on-secondary-container": "#5c647a",
              "on-secondary-fixed": "#131b2e",
              "secondary-container": "#dae2fd",
              "secondary": "#565e74",
              "on-tertiary": "#ffffff",
              "on-error": "#ffffff",
              "secondary-fixed": "#dae2fd",
              "on-surface-variant": "#3c4a42",
              "primary": "#006c49",
              "surface-variant": "#e0e3e5",
              "on-background": "#191c1e",
              "tertiary": "#855300",
              "on-secondary-fixed-variant": "#3f465c",
              "secondary-fixed-dim": "#bec6e0",
              "surface-tint": "#006c49",
              "surface-bright": "#f7f9fb",
              "on-primary-container": "#00422b",
              "inverse-surface": "#2d3133",
              "on-primary-fixed": "#002113",
              "surface-container-low": "#f2f4f6",
              "primary-fixed-dim": "#4edea3",
              "on-primary-fixed-variant": "#005236",
              "tertiary-container": "#e29100",
              "on-secondary": "#ffffff",
              "surface-container-highest": "#e0e3e5",
              "on-surface": "#191c1e",
              "surface-container-high": "#e6e8ea",
              "on-primary": "#ffffff",
              "error": "#ba1a1a",
              "tertiary-fixed": "#ffddb8"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .editorial-kern { letter-spacing: -0.02em; }
        .glass-header { backdrop-filter: blur(16px); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body antialiased min-h-screen flex flex-col">
<!-- Header (Suppressed Nav for Onboarding focus) -->
<header class="fixed top-0 w-full z-50 bg-white/60 backdrop-blur-md flex justify-between items-center px-6 py-4">
<span class="text-2xl font-black text-emerald-900 tracking-tighter">Kalé</span>
<button class="text-on-surface-variant font-medium text-sm px-4 py-2 hover:bg-slate-100 transition-colors rounded-lg">Skip</button>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-6 pt-24 pb-32 max-w-lg mx-auto w-full">
<!-- The "Digital Loom" Visual Canvas -->
<div class="relative w-full aspect-square mb-12 flex items-center justify-center">
<!-- Background "K" Brand Watermark -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-5">
<span class="text-[20rem] font-black leading-none">K</span>
</div>
<!-- Transaction List Preview (Asymmetric Layout) -->
<div class="relative w-full space-y-4">
<!-- Transaction Item 1: Food -->
<div class="bg-surface-container-lowest p-5 rounded-xl shadow-[0px_20px_40px_rgba(15,23,42,0.04)] transform -rotate-1 translate-x-2 border border-outline-variant/10">
<div class="flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-tertiary-container/10 flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined" data-icon="restaurant" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<div>
<p class="font-semibold text-on-surface editorial-kern">Local Market</p>
<p class="text-xs text-on-surface-variant">Food &amp; Dining</p>
</div>
</div>
<div class="text-right">
<p class="font-bold text-on-surface editorial-kern">- 4,500 FCFA</p>
<p class="text-[10px] uppercase font-bold tracking-widest text-on-surface-variant opacity-60">Today, 14:20</p>
</div>
</div>
</div>
<!-- Transaction Item 2: Transport -->
<div class="bg-surface-container-low p-5 rounded-xl shadow-[0px_20px_40px_rgba(15,23,42,0.06)] transform rotate-1 -translate-x-2 z-10">
<div class="flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary-container/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="directions_car" style="font-variation-settings: 'FILL' 1;">directions_car</span>
</div>
<div>
<p class="font-semibold text-on-surface editorial-kern">Taxi Ride</p>
<p class="text-xs text-on-surface-variant">Transport</p>
</div>
</div>
<div class="text-right">
<p class="font-bold text-on-surface editorial-kern">- 1,200 FCFA</p>
<p class="text-[10px] uppercase font-bold tracking-widest text-on-surface-variant opacity-60">Today, 09:15</p>
</div>
</div>
</div>
<!-- Transaction Item 3: Airtime -->
<div class="bg-surface-container-lowest p-5 rounded-xl shadow-[0px_20px_40px_rgba(15,23,42,0.04)] transform -rotate-2 translate-x-4 border border-outline-variant/10 opacity-80">
<div class="flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-secondary-container/20 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined" data-icon="signal_cellular_alt" style="font-variation-settings: 'FILL' 1;">signal_cellular_alt</span>
</div>
<div>
<p class="font-semibold text-on-surface editorial-kern">Airtime Top-up</p>
<p class="text-xs text-on-surface-variant">Communication</p>
</div>
</div>
<div class="text-right">
<p class="font-bold text-on-surface editorial-kern">- 2,000 FCFA</p>
<p class="text-[10px] uppercase font-bold tracking-widest text-on-surface-variant opacity-60">Yesterday</p>
</div>
</div>
</div>
</div>
</div>
<!-- Content Section -->
<div class="text-left w-full">
<h1 class="text-[2.5rem] leading-tight font-black text-on-surface editorial-kern mb-4">
                Track Every <br/>
<span class="text-primary italic">Franc</span>.
            </h1>
<p class="text-on-surface-variant text-lg leading-relaxed max-w-[280px]">
                Monitor every cent with precision and cultural warmth.
            </p>
</div>
</main>
<!-- Footer Actions (Anchored to Bottom) -->
<footer class="fixed bottom-0 left-0 w-full px-6 pb-12 pt-6 bg-gradient-to-t from-background via-background to-transparent">
<div class="max-w-lg mx-auto space-y-8">
<!-- Dot Indicators -->
<div class="flex gap-2 justify-start">
<div class="h-1.5 w-1.5 rounded-full bg-outline-variant"></div>
<div class="h-1.5 w-8 rounded-full bg-primary transition-all duration-300"></div>
<div class="h-1.5 w-1.5 rounded-full bg-outline-variant"></div>
</div>
<!-- Next Button -->
<button class="w-full h-[56px] bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold text-lg rounded-xl flex items-center justify-center gap-2 shadow-lg active:scale-95 transition-transform">
                Next
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</footer>
</body></html>
