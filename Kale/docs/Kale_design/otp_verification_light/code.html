</p>
</div>
<!-- OTP Input Grid -->

<input class="w-full h-12 text-center text-xl font-bold rounded-xl border-none bg-surface-container-low focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-200 text-on-surface" maxlength="1" placeholder="·" type="text"/>

<div class="flex items-center gap-2">
<button class="text-primary font-bold text-sm hover:opacity-80 transition-opacity">
