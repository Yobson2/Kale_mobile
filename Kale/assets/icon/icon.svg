<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Kalé App Icon Source — The Adinkra K -->
  <!-- Export as 1024x1024 PNG for flutter_launcher_icons -->

  <!-- Emerald background fill -->
  <rect width="1024" height="1024" fill="#10B981"/>

  <!-- Subtle circular glow for depth -->
  <circle cx="512" cy="512" r="320" fill="rgba(255,255,255,0.12)"/>

  <!-- Adinkra K logomark (scaled from 100x100 base) -->
  <g transform="translate(512, 512) scale(6.4) translate(-50, -50)">
    <!-- K vertical stem -->
    <rect x="28" y="20" width="7" height="60" fill="#FFFFFF"/>

    <!-- Ndebele diamond cutouts on stem -->
    <polygon points="31.5,29 34,32 31.5,35 29,32" fill="#10B981"/>
    <polygon points="31.5,59 34,62 31.5,65 29,62" fill="#10B981"/>

    <!-- K upper diagonal arm -->
    <polygon points="35,45 63,19 63,26 35,51" fill="#FFFFFF"/>

    <!-- Aya fern prongs -->
    <polygon points="62,18 67,12 63,20" fill="#FFFFFF"/>
    <polygon points="63,21 71,16 65,24" fill="#FFFFFF"/>
    <polygon points="64,25 72,24 66,28" fill="#FFFFFF"/>

    <!-- K lower diagonal arm -->
    <polygon points="35,49 63,74 63,81 35,55" fill="#FFFFFF"/>

    <!-- Maasai shield point -->
    <polygon points="63,74 68,79 63,84 58,79" fill="#FFFFFF"/>

    <!-- Nyame Nti junction dot -->
    <circle cx="33" cy="50" r="4" fill="#F59E0B"/>
  </g>
</svg>
