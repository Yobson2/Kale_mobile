<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Kalé Adaptive Icon Foreground — The Golden Spiral K -->
  <!-- Export as 1024x1024 PNG with transparency for Android adaptive icon -->
  <!-- Android adaptive icons use a 66% safe zone (centered 676x676 area) -->

  <!-- Golden Spiral K logomark centered in safe zone -->
  <!-- Safe zone: 174 to 850 (676px), center at 512 -->
  <g transform="translate(512, 512) scale(5.0) translate(-50, -50)">
    <!-- K vertical stem -->
    <rect x="28" y="20" width="8" height="60" rx="2" fill="#FFFFFF"/>

    <!-- K upper arm with outward golden spiral -->
    <path d="M 36,43 C 44,34 56,22 64,19 C 70,17 76,19 77,25 C 78,31 74,35 69,33 C 56,38 46,44 36,50 Z" fill="#FFFFFF"/>

    <!-- K lower arm with inward spiral -->
    <path d="M 36,57 C 46,64 56,72 64,77 C 68,79 70,77 69,73 C 68,69 64,69 62,72 C 52,68 44,60 36,50 Z" fill="#FFFFFF"/>

    <!-- Coin fulcrum -->
    <circle cx="32" cy="50" r="5" fill="#F59E0B"/>
    <circle cx="32" cy="50" r="3" fill="none" stroke="#D97706" stroke-width="0.7"/>
  </g>
</svg>
