<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Kalé Adaptive Icon Foreground — The Adinkra K -->
  <!-- Export as 1024x1024 PNG with transparency for Android adaptive icon -->
  <!-- Android adaptive icons use a 66% safe zone (centered 676x676 area) -->

  <!-- Adinkra K logomark centered in safe zone -->
  <!-- Safe zone: 174 to 850 (676px), center at 512 -->
  <g transform="translate(512, 512) scale(5.0) translate(-50, -50)">
    <!-- K vertical stem -->
    <rect x="28" y="20" width="7" height="60" fill="#FFFFFF"/>

    <!-- K upper diagonal arm -->
    <polygon points="35,45 63,19 63,26 35,51" fill="#FFFFFF"/>

    <!-- Aya fern prongs -->
    <polygon points="62,18 67,12 63,20" fill="#FFFFFF"/>
    <polygon points="63,21 71,16 65,24" fill="#FFFFFF"/>
    <polygon points="64,25 72,24 66,28" fill="#FFFFFF"/>

    <!-- K lower diagonal arm -->
    <polygon points="35,49 63,74 63,81 35,55" fill="#FFFFFF"/>

    <!-- Maasai shield point -->
    <polygon points="63,74 68,79 63,84 58,79" fill="#FFFFFF"/>

    <!-- Nyame Nti junction dot -->
    <circle cx="33" cy="50" r="4" fill="#F59E0B"/>
  </g>
</svg>
