<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Kalé — Bold K — Reversed B&W Variant -->
  <!-- Dark K on white squircle with two overlapping circles and border -->

  <defs>
    <clipPath id="squircleClip">
      <rect width="90" height="90" x="5" y="3" rx="19" ry="19"/>
    </clipPath>
    <filter id="shadow" x="-4%" y="-2%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background squircle with border and drop shadow -->
  <rect width="90" height="90" x="5" y="3" rx="19" ry="19" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Two overlapping decorative circles clipped to squircle -->
  <g clip-path="url(#squircleClip)">
    <circle cx="28" cy="25" r="42" fill="#0F172A" opacity="0.06"/>
    <circle cx="75" cy="72" r="38" fill="#0F172A" opacity="0.05"/>
  </g>

  <!-- Bold upright K letterform -->
  <path d="M 30 20 L 42 20 L 42 40 L 60 20 L 76 20 L 50 48 L 76 76 L 60 76 L 42 56 L 42 76 L 30 76 Z" fill="#0F172A"/>
</svg>
