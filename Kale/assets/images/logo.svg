<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Kalé — Bold K — Primary Light Variant -->
  <!-- White K on dark emerald squircle with two overlapping circles -->

  <defs>
    <clipPath id="squircleClip">
      <rect width="92" height="92" x="4" y="2" rx="20" ry="20"/>
    </clipPath>
    <filter id="shadow" x="-4%" y="-2%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background squircle with drop shadow -->
  <rect width="92" height="92" x="4" y="2" rx="20" ry="20" fill="#15785B" filter="url(#shadow)"/>

  <!-- Two overlapping decorative circles clipped to squircle -->
  <g clip-path="url(#squircleClip)">
    <circle cx="28" cy="25" r="42" fill="#FFFFFF" opacity="0.12"/>
    <circle cx="75" cy="72" r="38" fill="#FFFFFF" opacity="0.10"/>
  </g>

  <!-- Bold upright K letterform -->
  <path d="M 30 20 L 42 20 L 42 40 L 60 20 L 76 20 L 50 48 L 76 76 L 60 76 L 42 56 L 42 76 L 30 76 Z" fill="#FFFFFF"/>
</svg>
