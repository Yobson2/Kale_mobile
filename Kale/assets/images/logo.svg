<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Kalé — The Golden Spiral K — Primary Variant -->
  <!-- Emerald circle with white Spiral-K monogram -->
  <!-- Inspired by the Golden Ratio spirals found in African fractal geometry -->
  <!-- Upper arm spirals outward (growth/expansion), lower arm spirals inward (accumulation/saving) -->

  <!-- Circle container -->
  <circle cx="50" cy="50" r="42" fill="#10B981" stroke="#064E3B" stroke-width="1.5"/>

  <!-- K vertical stem -->
  <rect x="28" y="20" width="8" height="60" rx="2" fill="#FFFFFF"/>

  <!-- K upper arm with outward golden spiral (growth/expansion) -->
  <path d="
    M 36,43
    C 44,34 56,22 64,19
    C 70,17 76,19 77,25
    C 78,31 74,35 69,33
    C 56,38 46,44 36,50
    Z
  " fill="#FFFFFF"/>

  <!-- K lower arm with inward spiral (accumulation/saving) -->
  <path d="
    M 36,57
    C 46,64 56,72 64,77
    C 68,79 70,77 69,73
    C 68,69 64,69 62,72
    C 52,68 44,60 36,50
    Z
  " fill="#FFFFFF"/>

  <!-- Coin fulcrum — amber gold (currency focal point) -->
  <circle cx="32" cy="50" r="5" fill="#F59E0B"/>
  <circle cx="32" cy="50" r="3" fill="none" stroke="#D97706" stroke-width="0.7"/>
</svg>
