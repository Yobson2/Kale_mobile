<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Kalé — The Golden Spiral K — Black & White Variant -->
  <!-- Dark circle with white Spiral-K monogram -->

  <!-- Circle container -->
  <circle cx="50" cy="50" r="42" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>

  <!-- K vertical stem -->
  <rect x="28" y="20" width="8" height="60" rx="2" fill="#FFFFFF"/>

  <!-- K upper arm with outward golden spiral -->
  <path d="
    M 36,43
    C 44,34 56,22 64,19
    C 70,17 76,19 77,25
    C 78,31 74,35 69,33
    C 56,38 46,44 36,50
    Z
  " fill="#FFFFFF"/>

  <!-- K lower arm with inward spiral -->
  <path d="
    M 36,57
    C 46,64 56,72 64,77
    C 68,79 70,77 69,73
    C 68,69 64,69 62,72
    C 52,68 44,60 36,50
    Z
  " fill="#FFFFFF"/>

  <!-- Coin fulcrum — mid gray for B&W differentiation -->
  <circle cx="32" cy="50" r="5" fill="#94A3B8"/>
  <circle cx="32" cy="50" r="3" fill="none" stroke="#64748B" stroke-width="0.7"/>
</svg>
