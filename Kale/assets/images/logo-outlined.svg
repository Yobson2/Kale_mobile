<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Kalé — The Golden Spiral K — Outlined Variant -->
  <!-- Emerald strokes on transparent background -->

  <!-- Circle container (stroke only) -->
  <circle cx="50" cy="50" r="40.5" fill="none" stroke="#10B981" stroke-width="3"/>

  <!-- K stem (centerline stroke) -->
  <line x1="32" y1="22" x2="32" y2="78" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>

  <!-- K upper arm with outward spiral (centerline stroke) -->
  <path d="
    M 32,47
    C 42,36 54,24 64,19
    C 72,16 78,22 76,29
    C 74,34 68,34 66,31
  " fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>

  <!-- K lower arm with inward spiral (centerline stroke) -->
  <path d="
    M 32,53
    C 42,64 54,74 64,77
    C 68,79 70,76 69,73
    C 68,70 64,70 62,72
  " fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>

  <!-- Coin fulcrum (stroke only) -->
  <circle cx="32" cy="50" r="4.5" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
</svg>
