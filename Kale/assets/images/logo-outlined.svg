<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Kalé — The Cowrie Flow — Outlined Variant -->
  <!-- Emerald strokes on transparent background -->

  <!-- Circle container (stroke only) -->
  <circle cx="50" cy="50" r="40.5" fill="none" stroke="#10B981" stroke-width="3"/>

  <!-- Cowrie shell body (stroke only) -->
  <ellipse cx="50" cy="50" rx="20" ry="14" fill="none" stroke="#10B981" stroke-width="2.5"/>

  <!-- Shell ridges (ledger lines) -->
  <line x1="35" y1="46" x2="65" y2="46" stroke="#10B981" stroke-width="0.8" opacity="0.4"/>
  <line x1="34" y1="50" x2="66" y2="50" stroke="#10B981" stroke-width="0.8" opacity="0.4"/>
  <line x1="35" y1="54" x2="65" y2="54" stroke="#10B981" stroke-width="0.8" opacity="0.4"/>

  <!-- Shell opening (vertical slit) -->
  <path d="M 50,37 C 48,43 48,57 50,63" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>

  <!-- Income flow line (upward-right, thicker) -->
  <path d="M 50,37 C 48,30 55,22 65,20" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Expense flow line (downward-left, thinner) -->
  <path d="M 50,63 C 52,70 45,78 35,80" fill="none" stroke="#10B981" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Accent dot (stroke only) -->
  <circle cx="65" cy="20" r="3" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
</svg>
