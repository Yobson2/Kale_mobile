<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Kalé — The Adinkra K — Outlined Variant -->
  <!-- Emerald stroke squircle with emerald Adinkra K -->

  <!-- Squircle container (stroke only) -->
  <rect x="11.5" y="11.5" width="77" height="77" rx="16.5" ry="16.5"
        fill="none" stroke="#10B981" stroke-width="3"/>

  <!-- K vertical stem -->
  <rect x="28" y="20" width="7" height="60" fill="#10B981"/>

  <!-- K upper diagonal arm -->
  <polygon points="35,45 63,19 63,26 35,51" fill="#10B981"/>

  <!-- Aya fern prongs -->
  <polygon points="62,18 67,12 63,20" fill="#10B981"/>
  <polygon points="63,21 71,16 65,24" fill="#10B981"/>
  <polygon points="64,25 72,24 66,28" fill="#10B981"/>

  <!-- K lower diagonal arm -->
  <polygon points="35,49 63,74 63,81 35,55" fill="#10B981"/>

  <!-- Maasai shield point -->
  <polygon points="63,74 68,79 63,84 58,79" fill="#10B981"/>

  <!-- Nyame Nti junction dot -->
  <circle cx="33" cy="50" r="4" fill="#F59E0B"/>
</svg>
