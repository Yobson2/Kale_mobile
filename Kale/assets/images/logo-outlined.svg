<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Kalé — Bold K — Outlined Variant -->
  <!-- Emerald strokes on transparent background with decorative circles -->

  <defs>
    <clipPath id="squircleClip">
      <rect x="2" y="2" width="96" height="96" rx="20" ry="20"/>
    </clipPath>
  </defs>

  <!-- Squircle container (stroke only) -->
  <rect x="2" y="2" width="96" height="96" rx="20" ry="20" fill="none" stroke="#10B981" stroke-width="3"/>

  <!-- Two overlapping decorative circles clipped to squircle (stroke only) -->
  <g clip-path="url(#squircleClip)">
    <circle cx="28" cy="25" r="42" fill="none" stroke="#10B981" stroke-width="1" opacity="0.25"/>
    <circle cx="75" cy="72" r="38" fill="none" stroke="#10B981" stroke-width="1" opacity="0.20"/>
  </g>

  <!-- Bold upright K letterform (filled) -->
  <path d="M 28 22 L 40 22 L 40 40 L 60 22 L 74 22 L 48 50 L 74 78 L 60 78 L 40 58 L 40 78 L 28 78 Z" fill="#10B981"/>
</svg>
