<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Kalé — The Adinkra K — Dark Mode Variant -->
  <!-- Deep teal squircle with mint Adinkra K monogram -->

  <!-- Squircle container -->
  <rect x="10" y="10" width="80" height="80" rx="18" ry="18"
        fill="#064E3B" stroke="#34D399" stroke-width="2"/>

  <!-- Ndebele corner step patterns -->
  <g stroke="#34D399" stroke-opacity="0.3" stroke-width="1.2" fill="none" stroke-linecap="square">
    <polyline points="16,13.5 19.5,13.5 19.5,17 23,17"/>
    <polyline points="84,13.5 80.5,13.5 80.5,17 77,17"/>
    <polyline points="16,86.5 19.5,86.5 19.5,83 23,83"/>
    <polyline points="84,86.5 80.5,86.5 80.5,83 77,83"/>
  </g>

  <!-- K vertical stem -->
  <rect x="28" y="20" width="7" height="60" fill="#34D399"/>

  <!-- Ndebele diamond cutouts on stem -->
  <polygon points="31.5,29 34,32 31.5,35 29,32" fill="#064E3B"/>
  <polygon points="31.5,59 34,62 31.5,65 29,62" fill="#064E3B"/>

  <!-- K upper diagonal arm -->
  <polygon points="35,45 63,19 63,26 35,51" fill="#34D399"/>

  <!-- Aya fern prongs -->
  <polygon points="62,18 67,12 63,20" fill="#34D399"/>
  <polygon points="63,21 71,16 65,24" fill="#34D399"/>
  <polygon points="64,25 72,24 66,28" fill="#34D399"/>

  <!-- K lower diagonal arm -->
  <polygon points="35,49 63,74 63,81 35,55" fill="#34D399"/>

  <!-- Maasai shield point -->
  <polygon points="63,74 68,79 63,84 58,79" fill="#34D399"/>

  <!-- Nyame Nti junction dot -->
  <circle cx="33" cy="50" r="4" fill="#FBBF24"/>
</svg>
