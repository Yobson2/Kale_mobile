<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Kalé — The Cowrie Flow — Dark Mode Variant -->
  <!-- Deep teal circle with mint cowrie shell and flow lines -->

  <!-- Background circle -->
  <circle cx="50" cy="50" r="42" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>

  <!-- Cowrie shell body -->
  <ellipse cx="50" cy="50" rx="20" ry="14" fill="#34D399"/>

  <!-- Shell ridges (ledger lines) -->
  <line x1="34" y1="46" x2="66" y2="46" stroke="#064E3B" stroke-width="0.8" opacity="0.35"/>
  <line x1="33" y1="50" x2="67" y2="50" stroke="#064E3B" stroke-width="0.8" opacity="0.35"/>
  <line x1="34" y1="54" x2="66" y2="54" stroke="#064E3B" stroke-width="0.8" opacity="0.35"/>

  <!-- Shell opening (vertical slit) -->
  <path d="M 50,37 C 48,43 48,57 50,63" fill="none" stroke="#064E3B" stroke-width="2" stroke-linecap="round"/>

  <!-- Income flow line (upward-right, thicker) -->
  <path d="M 50,37 C 48,30 55,22 65,20" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Expense flow line (downward-left, thinner) -->
  <path d="M 50,63 C 52,70 45,78 35,80" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Amber accent dot at income tip -->
  <circle cx="65" cy="20" r="3.5" fill="#FBBF24"/>
  <circle cx="65" cy="20" r="2" fill="none" stroke="#D97706" stroke-width="0.6"/>
</svg>
