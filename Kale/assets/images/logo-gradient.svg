<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Kalé — The Adinkra K — Gradient (Premium) Variant -->

  <defs>
    <linearGradient id="emeraldGrad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="dotGrad" x1="29" y1="46" x2="37" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Squircle container with gradient -->
  <rect x="10" y="10" width="80" height="80" rx="18" ry="18" fill="url(#emeraldGrad)"/>

  <!-- Ndebele corner step patterns -->
  <g stroke="#34D399" stroke-opacity="0.2" stroke-width="1.2" fill="none" stroke-linecap="square">
    <polyline points="16,13.5 19.5,13.5 19.5,17 23,17"/>
    <polyline points="84,13.5 80.5,13.5 80.5,17 77,17"/>
    <polyline points="16,86.5 19.5,86.5 19.5,83 23,83"/>
    <polyline points="84,86.5 80.5,86.5 80.5,83 77,83"/>
  </g>

  <!-- K vertical stem -->
  <rect x="28" y="20" width="7" height="60" fill="#FFFFFF"/>

  <!-- Ndebele diamond cutouts (reveal gradient background) -->
  <polygon points="31.5,29 34,32 31.5,35 29,32" fill="url(#emeraldGrad)"/>
  <polygon points="31.5,59 34,62 31.5,65 29,62" fill="url(#emeraldGrad)"/>

  <!-- K upper diagonal arm -->
  <polygon points="35,45 63,19 63,26 35,51" fill="#FFFFFF"/>

  <!-- Aya fern prongs -->
  <polygon points="62,18 67,12 63,20" fill="#FFFFFF"/>
  <polygon points="63,21 71,16 65,24" fill="#FFFFFF"/>
  <polygon points="64,25 72,24 66,28" fill="#FFFFFF"/>

  <!-- K lower diagonal arm -->
  <polygon points="35,49 63,74 63,81 35,55" fill="#FFFFFF"/>

  <!-- Maasai shield point -->
  <polygon points="63,74 68,79 63,84 58,79" fill="#FFFFFF"/>

  <!-- Nyame Nti junction dot with gradient -->
  <circle cx="33" cy="50" r="4" fill="url(#dotGrad)"/>
</svg>
