<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Kalé — The Cowrie Flow — Gradient (Premium) Variant -->

  <defs>
    <linearGradient id="emeraldGrad" x1="8" y1="8" x2="92" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="62" y1="17" x2="68" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="50" cy="50" r="42" fill="url(#emeraldGrad)"/>

  <!-- Cowrie shell body -->
  <ellipse cx="50" cy="50" rx="20" ry="14" fill="#FFFFFF"/>

  <!-- Shell ridges (ledger lines) -->
  <line x1="34" y1="46" x2="66" y2="46" stroke="#10B981" stroke-width="0.8" opacity="0.35"/>
  <line x1="33" y1="50" x2="67" y2="50" stroke="#10B981" stroke-width="0.8" opacity="0.35"/>
  <line x1="34" y1="54" x2="66" y2="54" stroke="#10B981" stroke-width="0.8" opacity="0.35"/>

  <!-- Shell opening (vertical slit) -->
  <path d="M 50,37 C 48,43 48,57 50,63" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>

  <!-- Income flow line (upward-right, thicker) -->
  <path d="M 50,37 C 48,30 55,22 65,20" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Expense flow line (downward-left, thinner) -->
  <path d="M 50,63 C 52,70 45,78 35,80" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Amber accent dot with gradient -->
  <circle cx="65" cy="20" r="3.5" fill="url(#accentGrad)"/>
  <circle cx="65" cy="20" r="2" fill="none" stroke="#D97706" stroke-width="0.6"/>
</svg>
