<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Kalé — The Golden Spiral K — Gradient (Premium) Variant -->

  <defs>
    <linearGradient id="emeraldGrad" x1="8" y1="8" x2="92" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="27" y1="45" x2="37" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Circle container with gradient -->
  <circle cx="50" cy="50" r="42" fill="url(#emeraldGrad)"/>

  <!-- K vertical stem -->
  <rect x="28" y="20" width="8" height="60" rx="2" fill="#FFFFFF"/>

  <!-- K upper arm with outward golden spiral -->
  <path d="
    M 36,43
    C 44,34 56,22 64,19
    C 70,17 76,19 77,25
    C 78,31 74,35 69,33
    C 56,38 46,44 36,50
    Z
  " fill="#FFFFFF"/>

  <!-- K lower arm with inward spiral -->
  <path d="
    M 36,57
    C 46,64 56,72 64,77
    C 68,79 70,77 69,73
    C 68,69 64,69 62,72
    C 52,68 44,60 36,50
    Z
  " fill="#FFFFFF"/>

  <!-- Coin fulcrum with gradient -->
  <circle cx="32" cy="50" r="5" fill="url(#coinGrad)"/>
  <circle cx="32" cy="50" r="3" fill="none" stroke="#D97706" stroke-width="0.7"/>
</svg>
