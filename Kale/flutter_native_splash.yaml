# Native splash screen configuration.
#
# Splash images are generated from the "Le Fil" mark (see assets/images/logo-mark.svg).
# Run: dart run flutter_native_splash:create (or: make splash)
#
# See: https://pub.dev/packages/flutter_native_splash

flutter_native_splash:
  # Background color for light mode
  color: "#FFFFFF"

  # Background color for dark mode
  color_dark: "#0F172A"

  # Splash logo (Le Fil mark, 768x768 treated as xxxhdpi)
  image: assets/images/splash.png
  image_dark: assets/images/splash_dark.png

  # Android 12+ splash screen
  android_12:
    color: "#FFFFFF"
    color_dark: "#0F172A"
    icon_background_color: "#006C49"
    icon_background_color_dark: "#006C49"
    image: assets/images/splash_android12.png
    image_dark: assets/images/splash_android12.png

  # Keep splash visible until app is ready (removed manually in code)
  # fullscreen: true
